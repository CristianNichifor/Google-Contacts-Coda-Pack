name: CI

# Named `verify` so the check reports as `CI / verify`, matching the required
# check name used across the estate.
#
# A Coda Pack is uploaded, not deployed — `coda upload` pushes pack.ts straight
# to Coda, where a broken definition surfaces as a failing formula in someone's
# doc. `coda validate` is the same check Coda applies at upload time, so running
# it here moves that discovery from after the upload to before the merge.

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        # `npm ci` rather than `npm install`: it honours the lockfile exactly and
        # fails if package.json and the lockfile disagree, which is the check
        # that would have caught this repo depending on a package that does not
        # exist on the registry.
        run: npm ci

      # No standalone tsc step. The repo has no tsconfig.json, so a bare
      # `tsc --noEmit` fails on missing @types/node and a pre-ES2019 lib target
      # — config gaps, not defects in pack.ts. `coda validate` compiles the pack
      # with the SDK's own settings, which is the compilation that actually
      # matters. Adding a tsconfig here would risk disagreeing with it; worth
      # doing deliberately, not as a side effect of adding CI.
      - name: Validate pack
        run: npx coda validate pack.ts
